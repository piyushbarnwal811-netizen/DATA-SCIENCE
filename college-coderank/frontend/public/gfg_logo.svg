<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gfgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f8d46" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <filter id="gfgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect width="120" height="120" rx="26" fill="url(#gfgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="#66bb6a" stroke-width="2" opacity="0.35" />

  <!-- Stylized GeeksforGeeks Emblem (Double Curly Brackets) -->
  <g fill="#ffffff" filter="url(#gfgShadow)">
    <!-- Left Curly Bracket / G curve -->
    <path d="M 46,32 C 38,32 32,38 32,46 L 32,52 C 32,56 28,58 24,60 C 28,62 32,64 32,68 L 32,74 C 32,82 38,88 46,88 L 48,88 C 50.2,88 52,86.2 52,84 C 52,81.8 50.2,80 48,80 L 46,80 C 42,80 40,77 40,72 L 40,66 C 40,61.5 36.5,58 32,58 L 32,62 C 36.5,62 40,58.5 40,54 L 40,48 C 40,43 42,40 46,40 L 48,40 C 50.2,40 52,38.2 52,36 C 52,33.8 50.2,32 48,32 Z" />
    
    <!-- Right Curly Bracket -->
    <path d="M 74,32 C 82,32 88,38 88,46 L 88,52 C 88,56 92,58 96,60 C 92,62 88,64 88,68 L 88,74 C 88,82 82,88 74,88 L 72,88 C 69.8,88 68,86.2 68,84 C 68,81.8 69.8,80 72,80 L 74,80 C 78,80 80,77 80,72 L 80,66 C 80,61.5 83.5,58 88,58 L 88,62 C 83.5,62 80,58.5 80,54 L 80,48 C 80,43 78,40 74,40 L 72,40 C 69.8,40 68,38.2 68,36 C 68,33.8 69.8,32 72,32 Z" />

    <!-- Center Dot / Connection node -->
    <circle cx="60" cy="60" r="4.5" fill="#a5d6a7" />
  </g>

  <!-- GFG Brand Text -->
  <text x="60" y="103" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">GEEKSFORGEEKS</text>
</svg>
