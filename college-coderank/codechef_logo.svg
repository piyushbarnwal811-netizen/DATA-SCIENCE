<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5444" />
      <stop offset="100%" stop-color="#4e382b" />
    </linearGradient>
    <filter id="ccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Rounded Badge -->
  <rect width="120" height="120" rx="26" fill="url(#ccGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="#8d6e59" stroke-width="2" opacity="0.4" />

  <!-- Chef Hat Artwork -->
  <g fill="#ffffff" filter="url(#ccShadow)">
    <!-- Central Puffs of the Chef Hat -->
    <path d="M 60,25 C 50,25 44,32 44,40 C 37,40 32,46 32,53 C 32,61 38,67 46,68 L 74,68 C 82,67 88,61 88,53 C 88,46 83,40 76,40 C 76,32 70,25 60,25 Z" />
    
    <!-- Hat Base Band -->
    <rect x="42" y="70" width="36" height="12" rx="3" fill="#ffffff" />
    
    <!-- Hat Pleat Accent Lines -->
    <line x1="51" y1="44" x2="51" y2="65" stroke="#5B4638" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
    <line x1="60" y1="39" x2="60" y2="65" stroke="#5B4638" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
    <line x1="69" y1="44" x2="69" y2="65" stroke="#5B4638" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  </g>

  <!-- Code Symbol Accent on Hat Band -->
  <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#5B4638" text-anchor="middle" letter-spacing="0.5">&lt;/&gt;</text>
  
  <!-- CodeChef Brand Text -->
  <text x="60" y="102" font-family="'Manrope', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#fdfaf7" text-anchor="middle" letter-spacing="0.8">CODECHEF</text>
</svg>
